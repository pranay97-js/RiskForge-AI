[project]
name = "riskforge-ai"
version = "2.0.0"
description = "Razorpay RiskForge AI - Fraud and Chargeback Intelligence"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0,<3.0.0",
    "shap>=0.44.0",
    "joblib>=1.3.0",
    "plotly>=5.18.0",
    "streamlit>=1.35.0",
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.27.0",
    "httpx>=0.27.0",
]

[tool.vercel]
entrypoint = "app:app"
