<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Razorpay RiskForge AI — Merchant Risk Platform</title>
  
  <!-- Primary Meta Tags -->
  <meta name="title" content="Razorpay RiskForge AI — Merchant Risk Platform">
  <meta name="description" content="Production fraud detection, Bayesian risk scoring, TreeSHAP explainability, and automated dispute defense.">
  <meta name="theme-color" content="#020617">

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://risk-forge-ai.vercel.app/">
  <meta property="og:title" content="Razorpay RiskForge AI — Merchant Risk Platform">
  <meta property="og:description" content="Production fraud detection, Bayesian risk scoring, TreeSHAP explainability, and automated dispute defense.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230B72E7%22/><path d=%22M28 72L50 24H72L42 72H28Z%22 fill=%22%2300D2D2%22/><path d=%22M46 72L68 24H76L54 72H46Z%22 fill=%22%23FFFFFF%22 fill-opacity=%220.95%22/><path d=%22M38 52H68L62 64H32L38 52Z%22 fill=%22%2302042B%22 fill-opacity=%220.3%22/></svg>">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    #app-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      background-color: #020617;
    }

    /* Preloader Overlay */
    #preloader {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 30%, #0c1538 0%, #020617 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 50;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #preloader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loader-box {
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(11, 114, 231, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(11, 114, 231, 0.15);
      border-radius: 24px;
      padding: 32px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 360px;
      width: 90%;
      text-align: center;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .brand-rzp {
      color: #0b72e7;
    }

    .brand-rf {
      background: linear-gradient(135deg, #38bdf8 0%, #00d2d2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 24px;
      font-family: 'JetBrains Mono', monospace;
    }

    .progress-bar-container {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 16px;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 30%;
      background: linear-gradient(90deg, #0b72e7, #00d2d2);
      border-radius: 999px;
      animation: progressAnim 1.6s ease-in-out infinite;
    }

    @keyframes progressAnim {
      0% { left: -30%; width: 30%; }
      50% { width: 50%; }
      100% { left: 100%; width: 30%; }
    }

    .status-text {
      font-size: 12px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #00d2d2;
      box-shadow: 0 0 8px #00d2d2;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.15); }
    }
  </style>
</head>
<body>

  <!-- Preloader Screen -->
  <div id="preloader">
    <div class="loader-box">
      <div class="brand-row">
        <svg width="32" height="32" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="22" fill="#0B72E7"/>
          <path d="M28 72L50 24H72L42 72H28Z" fill="#00D2D2"/>
          <path d="M46 72L68 24H76L54 72H46Z" fill="#FFFFFF" fill-opacity="#0.95"/>
          <path d="M38 52H68L62 64H32L38 52Z" fill="#02042B" fill-opacity="#0.3"/>
        </svg>
        <span class="brand-title"><span class="brand-rzp">Razorpay</span> <span class="brand-rf">RiskForge</span></span>
      </div>
      <div class="brand-subtitle">Enterprise Risk Defense</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
      <div class="status-text">
        <span class="status-pulse"></span>
        <span>Connecting to Risk Engine...</span>
      </div>
    </div>
  </div>

  <!-- Full-Screen Native Streamlit Embed -->
  <iframe 
    id="app-frame"
    src="https://riskforge-ai.streamlit.app/?embed=true"
    allow="clipboard-read; clipboard-write; camera; microphone; geolocation"
    onload="document.getElementById('preloader').classList.add('loaded')"
  ></iframe>

  <script>
    // Fallback timer: ensure preloader dismisses smoothly
    setTimeout(function() {
      var p = document.getElementById('preloader');
      if (p) p.classList.add('loaded');
    }, 4500);
  </script>

</body>
</html>
